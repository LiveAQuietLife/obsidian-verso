name: A suggestion
description: "An idea for Verso, especially one that comes from a different way of working."
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Verso grew out of one person's way of working. If yours is different and the plugin doesn't fit it, that's worth hearing about. Every suggestion is read, though not everything can be built."
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do with your reading?
      description: "Start with what you're doing, not the feature. For example, \"I read two books at once for a book club and want both on one schedule.\""
    validations:
      required: true
  - type: textarea
    id: gets-in-the-way
    attributes:
      label: What gets in the way now?
      description: What does Verso do, or not do, that makes this harder?
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea, if you have one. A rough sketch is fine.
